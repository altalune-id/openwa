webhooks.guide_heading: "連携の手順"
webhooks.guide_intro: "数分で受信側を接続できます。すべての配信は、署名付きの JSON POST として URL に送られます。"
webhooks.guide_step_url: "「新しいエンドポイント」をクリックし、イベントを受け取る https:// の URL を入力します。"
webhooks.guide_step_events: "購読するイベントを選んで保存します。"
webhooks.guide_step_secret: "署名シークレットをコピーします。表示は一度きりなので、受信側が読める場所に保存してください。"
webhooks.guide_step_verify: "すべてのリクエストで署名を検証します。エンドポイントのページに Go、Node.js、Python のコピー用コードがあります。"
webhooks.guide_step_test: "エンドポイントのページで「テスト送信」をクリックし、ping イベントを送ります。"
webhooks.guide_step_inspect: "「最近の配信」で「詳細」をクリックすると、送信されたペイロード、ヘッダー、各試行を確認できます。"
webhooks.guide_step_retry: "受信側を修正したら、失敗した配信を再試行するか、失敗をまとめて再試行します。"
webhooks.guide_receiver_heading: "受信側のチェックリスト"
webhooks.guide_respond: "まず 2xx をすぐに返し、処理はその後で行います。それ以外のステータス、リダイレクト、タイムアウトは失敗として扱われます。"
webhooks.guide_dedupe: "同じ配信が複数回届くことがあります。次のヘッダーで重複を除いてください。再試行でも値は変わりません:"
webhooks.guide_correlate: "同じイベントを受け取るすべてのエンドポイントには、次のヘッダーに同じ値が入ります:"
webhooks.guide_retries: "失敗した配信は自動で再試行され、約 {{.TotalHours}} 時間の間に最大 {{.Attempts}} 回試行します。最初の待機は {{.FirstSeconds}} 秒、最長で {{.LongestHours}} 時間です。"
webhooks.verify_heading: "署名の検証"
webhooks.verify_intro: "タイムスタンプ、ドット、生のリクエストボディをつないだものに対し、署名シークレット全体（whsec_ の接頭辞を含む）を鍵として HMAC-SHA256 を計算します。v1= を付けた小文字の 16 進数を、署名ヘッダー内の各値と定数時間で比較し、時計と 5 分を超えてずれたタイムスタンプは拒否してください。"
webhooks.verify_headers_label: "読み取るヘッダー:"
webhooks.verify_env: "このサンプルは OPENWA_WEBHOOK_SECRET からシークレットを読み、JSON として解析する前の、受信したままのボディで署名を計算します。"
