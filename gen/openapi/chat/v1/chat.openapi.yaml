          description: Public id (cht_...)
        deviceId:
          type: string
          title: device_id
          description: Device public id (dev_...)
        jid:
          type: string
          title: jid
        kind:
          type: string
          title: kind
          description: '"dm" or "group"'
        name:
          type: string
          title: name
        lastMessageAt:
          title: last_message_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        lastMessagePreview:
          type: string
          title: last_message_preview
        unreadCount:
          type: integer
          title: unread_count
          format: int32
        archived:
          type: boolean
          title: archived
      title: Chat
      additionalProperties: false
    chat.v1.GetRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        chatId:
          type: string
          title: chat_id
      title: GetRequest
      additionalProperties: false
    chat.v1.GetResponse:
