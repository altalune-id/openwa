        inviteLink:
          type: string
          title: invite_link
        chatId:
          type: string
          title: chat_id
          description: Chat public id (cht_...); empty for a group with no stored chat
        joined:
          type: boolean
          title: joined
          description: False for a stored group the device has left
      title: Group
      additionalProperties: false
    chat.v1.GroupInfoRequest:
