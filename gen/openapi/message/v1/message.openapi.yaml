components:
  schemas:
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`. This is used to determine the schema of the data in the `value` field and is the discriminator for the `debug` field.'
        value:
          type: string
          format: binary
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          oneOf:
            - type: object
              title: Any
              additionalProperties: true
              description: Detailed error information.
          discriminator:
            propertyName: type
          title: Debug
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: |-
        A Timestamp represents a point in time independent of any time zone or local
         calendar, encoded as a count of seconds and fractions of seconds at
         nanosecond resolution. The count is relative to an epoch at UTC midnight on
         January 1, 1970, in the proleptic Gregorian calendar which extends the
         Gregorian calendar backwards to year one.

         All minutes are 60 seconds long. Leap seconds are "smeared" so that no leap
         second table is needed for interpretation, using a [24-hour linear
         smear](https://developers.google.com/time/smear).

         The range is from 0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999999999Z. By
         restricting to that range, we ensure that we can convert to and from [RFC
         3339](https://www.ietf.org/rfc/rfc3339.txt) date strings.

         # Examples

         Example 1: Compute Timestamp from POSIX `time()`.

             Timestamp timestamp;
             timestamp.set_seconds(time(NULL));
             timestamp.set_nanos(0);

         Example 2: Compute Timestamp from POSIX `gettimeofday()`.

             struct timeval tv;
             gettimeofday(&tv, NULL);

             Timestamp timestamp;
             timestamp.set_seconds(tv.tv_sec);
             timestamp.set_nanos(tv.tv_usec * 1000);

         Example 3: Compute Timestamp from Win32 `GetSystemTimeAsFileTime()`.

             FILETIME ft;
             GetSystemTimeAsFileTime(&ft);
             UINT64 ticks = (((UINT64)ft.dwHighDateTime) << 32) | ft.dwLowDateTime;

             // A Windows tick is 100 nanoseconds. Windows epoch 1601-01-01T00:00:00Z
             // is 11644473600 seconds before Unix epoch 1970-01-01T00:00:00Z.
             Timestamp timestamp;
             timestamp.set_seconds((INT64) ((ticks / 10000000) - 11644473600LL));
             timestamp.set_nanos((INT32) ((ticks % 10000000) * 100));

         Example 4: Compute Timestamp from Java `System.currentTimeMillis()`.

             long millis = System.currentTimeMillis();

             Timestamp timestamp = Timestamp.newBuilder().setSeconds(millis / 1000)
                 .setNanos((int) ((millis % 1000) * 1000000)).build();

         Example 5: Compute Timestamp from Java `Instant.now()`.

             Instant now = Instant.now();

             Timestamp timestamp =
                 Timestamp.newBuilder().setSeconds(now.getEpochSecond())
                     .setNanos(now.getNano()).build();

         Example 6: Compute Timestamp from current time in Python.

             timestamp = Timestamp()
             timestamp.GetCurrentTime()

         # JSON Mapping

         In JSON format, the Timestamp type is encoded as a string in the
         [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format. That is, the
         format is "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z"
         where {year} is always expressed using four digits while {month}, {day},
         {hour}, {min}, and {sec} are zero-padded to two digits each. The fractional
         seconds, which can go up to 9 digits (i.e. up to 1 nanosecond resolution),
         are optional. The "Z" suffix indicates the timezone ("UTC"); the timezone
         is required. A proto3 JSON serializer should always use UTC (as indicated by
         "Z") when printing the Timestamp type and a proto3 JSON parser should be
         able to accept both UTC and other timezones (as indicated by an offset).

         For example, "2017-01-15T01:30:15.01Z" encodes 15.01 seconds past
         01:30 UTC on January 15, 2017.

         In JavaScript, one can convert a Date object to this format using the
         standard
         [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)
         method. In Python, a standard `datetime.datetime` object can be converted
         to this format using
         [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with
         the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use
         the Joda Time's [`ISODateTimeFormat.dateTime()`](
         http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()
         ) to obtain a formatter capable of generating timestamps in this format.
    message.v1.EditRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        messageId:
          type: string
          title: message_id
        text:
          type: string
          title: text
      title: EditRequest
      additionalProperties: false
    message.v1.EditResponse:
      type: object
      properties:
        message:
          title: message
          $ref: '#/components/schemas/message.v1.Message'
      title: EditResponse
      additionalProperties: false
    message.v1.GetRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        messageId:
          type: string
          title: message_id
      title: GetRequest
      additionalProperties: false
    message.v1.GetResponse:
      type: object
      properties:
        message:
          title: message
          $ref: '#/components/schemas/message.v1.Message'
      title: GetResponse
      additionalProperties: false
    message.v1.ListRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        deviceId:
          type: string
          title: device_id
          description: Device public id (dev_...); list its messages across chats
        chatId:
          type: string
          title: chat_id
          description: Chat public id (cht_...); list its messages
        sinceId:
          type: string
          title: since_id
          description: Message public id (msg_...); return newer messages, oldest first
        cursor:
          type: string
          title: cursor
          description: next_cursor of a previous page
        limit:
          type: integer
          title: limit
          format: int32
          description: Page size, 1 to 200; default 50
      title: ListRequest
      additionalProperties: false
    message.v1.ListResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/message.v1.Message'
          title: messages
        nextCursor:
          type: string
          title: next_cursor
      title: ListResponse
      additionalProperties: false
    message.v1.Location:
      type: object
      properties:
        lat:
          type: number
          title: lat
          format: double
        lng:
          type: number
          title: lng
          format: double
        name:
          type: string
          title: name
        address:
          type: string
          title: address
      title: Location
      additionalProperties: false
    message.v1.MarkReadRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        chatId:
          type: string
          title: chat_id
      title: MarkReadRequest
      additionalProperties: false
    message.v1.MarkReadResponse:
      type: object
      title: MarkReadResponse
      additionalProperties: false
    message.v1.MediaInfo:
      type: object
      properties:
        mime:
          type: string
          title: mime
        size:
          type:
            - integer
            - string
          title: size
          format: int64
        filename:
          type: string
          title: filename
        voice:
          type: boolean
          title: voice
        url:
          type: string
          title: url
          description: Authenticated data-plane download; needs an API key with messages:read
      title: MediaInfo
      additionalProperties: false
    message.v1.MediaInput:
      type: object
      properties:
        data:
          type: string
          title: data
          format: byte
          description: File content; up to whatsapp.mediaMaxBytes on the RPC and 4 MiB through MCP; use url for larger files
        url:
          type: string
          title: url
          description: Public http(s) URL the server downloads
        mime:
          type: string
          title: mime
        filename:
          type: string
          title: filename
        caption:
          type: string
          title: caption
        voice:
          type: boolean
          title: voice
          description: Send audio/ogg as a voice note
      title: MediaInput
      additionalProperties: false
    message.v1.Message:
      type: object
      properties:
        id:
          type: string
          title: id
          description: Public id (msg_...)
        deviceId:
          type: string
          title: device_id
          description: Device public id (dev_...)
        chatId:
          type: string
          title: chat_id
          description: Chat public id (cht_...)
        direction:
          type: string
          title: direction
          description: '"in" or "out"'
        waId:
          type: string
          title: wa_id
        type:
          type: string
          title: type
        status:
          type: string
          title: status
          description: queued, sending, sent, delivered, read, played, failed, or received
        body:
          type: string
          title: body
        senderJid:
          type: string
          title: sender_jid
        senderPhone:
          type: string
          title: sender_phone
          description: Digits without "+"; empty when WhatsApp hides the number
        senderName:
          type: string
          title: sender_name
        fromMe:
          type: boolean
          title: from_me
        media:
          title: media
          $ref: '#/components/schemas/message.v1.MediaInfo'
        location:
          title: location
          $ref: '#/components/schemas/message.v1.Location'
        quotedWaId:
          type: string
          title: quoted_wa_id
        targetWaId:
          type: string
          title: target_wa_id
        mentions:
          type: array
          items:
            type: string
          title: mentions
        error:
          type: string
          title: error
        attempts:
          type: integer
          title: attempts
          format: int32
        timestamp:
          title: timestamp
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        sentAt:
          title: sent_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        deliveredAt:
          title: delivered_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        readAt:
          title: read_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Message
      additionalProperties: false
    message.v1.ReactRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        messageId:
          type: string
          title: message_id
        emoji:
          type: string
          title: emoji
          description: One emoji; empty removes the reaction
      title: ReactRequest
      additionalProperties: false
    message.v1.ReactResponse:
      type: object
      properties:
        message:
          title: message
          $ref: '#/components/schemas/message.v1.Message'
      title: ReactResponse
      additionalProperties: false
    message.v1.RevokeRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        messageId:
          type: string
          title: message_id
      title: RevokeRequest
      additionalProperties: false
    message.v1.RevokeResponse:
      type: object
      properties:
        message:
          title: message
          $ref: '#/components/schemas/message.v1.Message'
      title: RevokeResponse
      additionalProperties: false
    message.v1.SendRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
          description: UUID of the project; omit to use the credential's active project
        deviceId:
          type: string
          title: device_id
          description: Device public id (dev_...); omit when the project has exactly one device
        to:
          type: string
          title: to
          description: 'Recipient: phone number with country code (e.g. 628123456789) or a JID'
        text:
          type: string
          title: text
        media:
          title: media
          $ref: '#/components/schemas/message.v1.MediaInput'
        location:
          title: location
          $ref: '#/components/schemas/message.v1.Location'
        replyTo:
          type: string
          title: reply_to
          description: A message public id (msg_...) or a WhatsApp message id to quote
        mentions:
          type: array
          items:
            type: string
          title: mentions
          description: Phone numbers (digits) mentioned in the text as @<digits>
        markReadFirst:
          type: boolean
          title: mark_read_first
          description: Mark the chat read before sending
      title: SendRequest
      additionalProperties: false
    message.v1.SendResponse:
      type: object
      properties:
        message:
          title: message
          $ref: '#/components/schemas/message.v1.Message'
      title: SendResponse
      additionalProperties: false
security: []
tags:
  - name: message.v1.MessageService
