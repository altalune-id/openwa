      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/message.v1.EditRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
