openapi: 3.1.0
info:
  title: device.v1
paths:
  /device.v1.DeviceService/CreateDevice:
    post:
      tags:
        - device.v1.DeviceService
      summary: CreateDevice
      operationId: device.v1.DeviceService.CreateDevice
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/device.v1.CreateDeviceRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/device.v1.CreateDeviceResponse'
  /device.v1.DeviceService/DeleteDevice:
    post:
      tags:
        - device.v1.DeviceService
      summary: DeleteDevice
      operationId: device.v1.DeviceService.DeleteDevice
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/device.v1.DeleteDeviceRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/device.v1.DeleteDeviceResponse'
  /device.v1.DeviceService/GetDevice:
    post:
      tags:
        - device.v1.DeviceService
      summary: GetDevice
      operationId: device.v1.DeviceService.GetDevice
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/device.v1.GetDeviceRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/device.v1.GetDeviceResponse'
  /device.v1.DeviceService/GetLinkState:
    post:
      tags:
        - device.v1.DeviceService
      summary: GetLinkState
      operationId: device.v1.DeviceService.GetLinkState
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/device.v1.GetLinkStateRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/device.v1.GetLinkStateResponse'
  /device.v1.DeviceService/LinkWithPhone:
    post:
      tags:
        - device.v1.DeviceService
      summary: LinkWithPhone
      operationId: device.v1.DeviceService.LinkWithPhone
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/device.v1.LinkWithPhoneRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/device.v1.LinkWithPhoneResponse'
  /device.v1.DeviceService/ListDevices:
    post:
      tags:
        - device.v1.DeviceService
      summary: ListDevices
      operationId: device.v1.DeviceService.ListDevices
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
