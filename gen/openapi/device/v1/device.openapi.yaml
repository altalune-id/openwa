components:
  schemas:
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`. This is used to determine the schema of the data in the `value` field and is the discriminator for the `debug` field.'
        value:
          type: string
          format: binary
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          oneOf:
            - type: object
              title: Any
              additionalProperties: true
              description: Detailed error information.
          discriminator:
            propertyName: type
          title: Debug
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    device.v1.CreateDeviceRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
          description: UUID of the project; omit to use the credential's active project
        name:
          type: string
          title: name
          description: 1 to 64 characters, unique in the project
      title: CreateDeviceRequest
      additionalProperties: false
    device.v1.CreateDeviceResponse:
      type: object
      properties:
        device:
          title: device
          $ref: '#/components/schemas/device.v1.Device'
      title: CreateDeviceResponse
      additionalProperties: false
    device.v1.DeleteDeviceRequest:
      type: object
      properties:
        deviceId:
          type: string
          title: device_id
      title: DeleteDeviceRequest
      additionalProperties: false
    device.v1.DeleteDeviceResponse:
      type: object
      title: DeleteDeviceResponse
      additionalProperties: false
    device.v1.Device:
      type: object
      properties:
        id:
          type: string
          title: id
          description: Public id (dev_…); every device RPC takes it as device_id
        projectId:
          type: string
          title: project_id
        name:
          type: string
          title: name
        rules:
          title: rules
          $ref: '#/components/schemas/device.v1.Rules'
        version:
          type: integer
          title: version
          format: int32
          description: Optimistic-concurrency version; pass it back as version on UpdateDevice
        state:
          type: string
          title: state
          description: '"unlinked", "linking", "connected", "disconnected" or "logged_out"'
        phone:
          type: string
          title: phone
          description: Paired phone number, E.164 digits without "+"
        pushName:
          type: string
          title: push_name
        reason:
          type: string
          title: reason
          description: Reason recorded with the last state change
        lastSeenAt:
          title: last_seen_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        live:
          type: boolean
          title: live
          description: True when this server holds the device's session and it is connected
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updatedAt:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        link:
          title: link
          description: The pairing attempt in progress, when there is one
          $ref: '#/components/schemas/device.v1.LinkState'
      title: Device
      additionalProperties: false
    device.v1.GetDeviceRequest:
      type: object
      properties:
        deviceId:
          type: string
          title: device_id
          description: Public id of the device (dev_…); the internal UUID is never accepted
      title: GetDeviceRequest
      additionalProperties: false
    device.v1.GetDeviceResponse:
      type: object
      properties:
        device:
          title: device
          $ref: '#/components/schemas/device.v1.Device'
      title: GetDeviceResponse
      additionalProperties: false
    device.v1.GetLinkStateRequest:
      type: object
      properties:
        deviceId:
          type: string
          title: device_id
          description: Public id of the device (dev_…); the internal UUID is never accepted; omit when the project has exactly one device
        projectId:
          type: string
          title: project_id
          description: UUID of the project; omit to use the credential's active project
      title: GetLinkStateRequest
      additionalProperties: false
    device.v1.GetLinkStateResponse:
      type: object
      properties:
        deviceId:
          type: string
          title: device_id
        link:
          title: link
          $ref: '#/components/schemas/device.v1.LinkState'
      title: GetLinkStateResponse
      additionalProperties: false
    device.v1.LinkState:
      type: object
      properties:
        method:
          type: string
          title: method
          description: '"qr" or "phone"'
        outcome:
          type: string
          title: outcome
          description: '"pending", "connected", "timeout", "failed" or "none"'
        qr:
          type: string
          title: qr
          description: Raw QR payload while a QR attempt is pending
        png:
          type: string
          title: png
          format: byte
          description: PNG rendering of the QR payload, base64 in JSON
        pairingCode:
          type: string
          title: pairing_code
          description: 8-character code to type on the phone for a phone-code attempt
        expiresAt:
          title: expires_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        error:
          type: string
          title: error
        startedAt:
          title: started_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        id:
          type: string
          title: id
          description: Public id of the pairing attempt (lnk_…)
      title: LinkState
      additionalProperties: false
    device.v1.LinkWithPhoneRequest:
      type: object
      properties:
        deviceId:
          type: string
          title: device_id
          description: Public id of the device (dev_…); the internal UUID is never accepted; omit when the project has exactly one device
        projectId:
          type: string
          title: project_id
          description: UUID of the project; omit to use the credential's active project
        phone:
          type: string
          title: phone
          description: Phone number in international format, e.g. +62 812 3456 7890
      title: LinkWithPhoneRequest
      additionalProperties: false
    device.v1.LinkWithPhoneResponse:
      type: object
      properties:
        deviceId:
          type: string
          title: device_id
        link:
          title: link
          $ref: '#/components/schemas/device.v1.LinkState'
      title: LinkWithPhoneResponse
      additionalProperties: false
    device.v1.ListDevicesRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
          description: UUID of the project; omit to use the credential's active project
      title: ListDevicesRequest
      additionalProperties: false
    device.v1.ListDevicesResponse:
      type: object
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/device.v1.Device'
          title: devices
      title: ListDevicesResponse
      additionalProperties: false
    device.v1.Rules:
      type: object
      properties:
        groupMode:
          type: string
          title: group_mode
          description: 'Which group messages match: "ignore", "mention" or "open"'
        allowedSenders:
          type: array
          items:
            type: string
          title: allowed_senders
          description: E.164 digits without "+"; empty allows every sender
        allowedGroups:
          type: array
          items:
            type: string
          title: allowed_groups
          description: Group JIDs ending in @g.us; empty allows every group
        triggerPrefix:
          type: string
          title: trigger_prefix
          description: Only messages starting with this text match; empty matches all
        ignoreFromMe:
          type: boolean
          title: ignore_from_me
          description: Skip messages sent from the paired account itself
      title: Rules
      additionalProperties: false
    device.v1.StartLinkRequest:
      type: object
      properties:
        deviceId:
          type: string
          title: device_id
          description: Public id of the device (dev_…); the internal UUID is never accepted; omit when the project has exactly one device
        projectId:
          type: string
          title: project_id
          description: UUID of the project; omit to use the credential's active project
      title: StartLinkRequest
      additionalProperties: false
    device.v1.StartLinkResponse:
      type: object
      properties:
        deviceId:
          type: string
          title: device_id
        link:
          title: link
          $ref: '#/components/schemas/device.v1.LinkState'
      title: StartLinkResponse
      additionalProperties: false
    device.v1.UnlinkRequest:
      type: object
      properties:
        deviceId:
          type: string
          title: device_id
          description: Public id of the device (dev_…); the internal UUID is never accepted; omit when the project has exactly one device
        projectId:
          type: string
          title: project_id
          description: UUID of the project; omit to use the credential's active project
      title: UnlinkRequest
      additionalProperties: false
    device.v1.UnlinkResponse:
      type: object
      properties:
        deviceId:
          type: string
          title: device_id
      title: UnlinkResponse
      additionalProperties: false
    device.v1.UpdateDeviceRequest:
      type: object
      properties:
        deviceId:
          type: string
          title: device_id
        name:
          type:
            - string
            - "null"
          title: name
          description: New name; omit to keep it
        rules:
          title: rules
          description: New rules; omit to keep them
          $ref: '#/components/schemas/device.v1.Rules'
        version:
          type: integer
          title: version
          format: int32
          description: Version the write is conditioned on; 0 writes unconditionally
      title: UpdateDeviceRequest
      additionalProperties: false
    device.v1.UpdateDeviceResponse:
      type: object
      properties:
        device:
          title: device
          $ref: '#/components/schemas/device.v1.Device'
      title: UpdateDeviceResponse
      additionalProperties: false
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: |-
        A Timestamp represents a point in time independent of any time zone or local
         calendar, encoded as a count of seconds and fractions of seconds at
         nanosecond resolution. The count is relative to an epoch at UTC midnight on
         January 1, 1970, in the proleptic Gregorian calendar which extends the
         Gregorian calendar backwards to year one.

         All minutes are 60 seconds long. Leap seconds are "smeared" so that no leap
         second table is needed for interpretation, using a [24-hour linear
         smear](https://developers.google.com/time/smear).

         The range is from 0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999999999Z. By
         restricting to that range, we ensure that we can convert to and from [RFC
         3339](https://www.ietf.org/rfc/rfc3339.txt) date strings.

         # Examples

         Example 1: Compute Timestamp from POSIX `time()`.

             Timestamp timestamp;
             timestamp.set_seconds(time(NULL));
             timestamp.set_nanos(0);

         Example 2: Compute Timestamp from POSIX `gettimeofday()`.

             struct timeval tv;
             gettimeofday(&tv, NULL);

             Timestamp timestamp;
             timestamp.set_seconds(tv.tv_sec);
             timestamp.set_nanos(tv.tv_usec * 1000);

         Example 3: Compute Timestamp from Win32 `GetSystemTimeAsFileTime()`.

             FILETIME ft;
             GetSystemTimeAsFileTime(&ft);
             UINT64 ticks = (((UINT64)ft.dwHighDateTime) << 32) | ft.dwLowDateTime;

             // A Windows tick is 100 nanoseconds. Windows epoch 1601-01-01T00:00:00Z
             // is 11644473600 seconds before Unix epoch 1970-01-01T00:00:00Z.
             Timestamp timestamp;
             timestamp.set_seconds((INT64) ((ticks / 10000000) - 11644473600LL));
             timestamp.set_nanos((INT32) ((ticks % 10000000) * 100));

         Example 4: Compute Timestamp from Java `System.currentTimeMillis()`.

             long millis = System.currentTimeMillis();

             Timestamp timestamp = Timestamp.newBuilder().setSeconds(millis / 1000)
                 .setNanos((int) ((millis % 1000) * 1000000)).build();

         Example 5: Compute Timestamp from Java `Instant.now()`.

             Instant now = Instant.now();

             Timestamp timestamp =
                 Timestamp.newBuilder().setSeconds(now.getEpochSecond())
                     .setNanos(now.getNano()).build();

         Example 6: Compute Timestamp from current time in Python.

             timestamp = Timestamp()
             timestamp.GetCurrentTime()

         # JSON Mapping

         In JSON format, the Timestamp type is encoded as a string in the
         [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format. That is, the
         format is "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z"
         where {year} is always expressed using four digits while {month}, {day},
         {hour}, {min}, and {sec} are zero-padded to two digits each. The fractional
         seconds, which can go up to 9 digits (i.e. up to 1 nanosecond resolution),
         are optional. The "Z" suffix indicates the timezone ("UTC"); the timezone
         is required. A proto3 JSON serializer should always use UTC (as indicated by
         "Z") when printing the Timestamp type and a proto3 JSON parser should be
         able to accept both UTC and other timezones (as indicated by an offset).

         For example, "2017-01-15T01:30:15.01Z" encodes 15.01 seconds past
         01:30 UTC on January 15, 2017.

         In JavaScript, one can convert a Date object to this format using the
         standard
         [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)
         method. In Python, a standard `datetime.datetime` object can be converted
         to this format using
         [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with
         the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use
         the Joda Time's [`ISODateTimeFormat.dateTime()`](
         http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()
         ) to obtain a formatter capable of generating timestamps in this format.
