              schema:
                $ref: '#/components/schemas/device.v1.UnlinkResponse'
  /device.v1.DeviceService/UpdateDevice:
    post:
      tags:
        - device.v1.DeviceService
      summary: UpdateDevice
      operationId: device.v1.DeviceService.UpdateDevice
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/device.v1.UpdateDeviceRequest'
        required: true
