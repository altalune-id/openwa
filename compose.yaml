name: openwa

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openwa
      POSTGRES_PASSWORD: openwa
      POSTGRES_DB: openwa
    ports:
      - "5432:5432"
    volumes:
      - ./docker/data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openwa -d openwa"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI at http://localhost:8025

  nats:
    image: nats:2.15-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "--auth", "openwa-dev"]
    ports:
      - "4222:4222"
    volumes:
      - ./docker/data/nats:/data

  openwa:
    build:
      context: .
      args:
        VERSION: dev
        COMMIT: local
        BUILD_TIME: unknown
    image: openwa:dev
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      nats:
        condition: service_started
    ports:
      - "5150:5150"
    environment:
      OPENWA_MODE: selfhosted
      OPENWA_HTTP_ADDR: "0.0.0.0:5150"

      OPENWA_DB_DSN: "postgres://openwa:openwa@postgres:5432/openwa?sslmode=disable"
      OPENWA_DB_ALLOW_BYPASS_RLS: "true"
      OPENWA_DB_AUTO_MIGRATE: "true"

      OPENWA_MAIL_DRIVER: smtp
      OPENWA_MAIL_FROM: "no-reply@openwa.local"
      OPENWA_MAIL_SMTP_HOST: mailpit
      OPENWA_MAIL_SMTP_PORT: "1025"
      OPENWA_MAIL_SMTP_USER: ""
      OPENWA_MAIL_SMTP_PASS: ""
      OPENWA_MAIL_SMTP_TLS: "false"

      OPENWA_QUEUE_ENABLED: "true"
      OPENWA_QUEUE_URL: "nats://nats:4222"
      OPENWA_QUEUE_TOKEN: "openwa-dev"

      OPENWA_GENESIS_EMAIL: admin@openwa.local
      OPENWA_GENESIS_PASSWORD: change-me
    healthcheck:
      test: ["CMD", "/openwa", "healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
