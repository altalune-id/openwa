  addr: ":5150"
  # env: OPENWA_HTTP_BASE_PATH
  basePath: ""
  # [required] env: OPENWA_HTTP_BASE_URL
  baseURL: ""
  # env: OPENWA_HTTP_COOKIE_SECURE
  cookieSecure: false
  csp:
    # [required] env: OPENWA_HTTP_CSP_ENABLED
    enabled: true
    # env: OPENWA_HTTP_CSP_REPORT_ONLY
    reportOnly: false
    # env: OPENWA_HTTP_CSP_REPORT_URI
    reportURI: ""
  # env: OPENWA_HTTP_ROBOTS_TXT
