  # env: OPENWA_DB_CONNECT_TIMEOUT
  connectTimeout: 30s
  # [required, secret] env: OPENWA_DB_DSN
  dsn: ""
  health:
    # env: OPENWA_DB_HEALTH_INTERVAL
    interval: 30s
    # env: OPENWA_DB_HEALTH_TIMEOUT
    timeout: 2s
  # env: OPENWA_DB_MAX_IDLE_CONNS
  maxIdleConns: ""
  # env: OPENWA_DB_MAX_OPEN_CONNS
  maxOpenConns: ""
  migrator:
    # [secret, bootstrap] env: OPENWA_DB_MIGRATOR_DSN
    dsn: ""
    # [bootstrap] env: OPENWA_DB_MIGRATOR_ROLE
    role: ""
  reader:
    # env: OPENWA_DB_READER_CONN_MAX_IDLE_TIME
    connMaxIdleTime: ""
    # env: OPENWA_DB_READER_CONN_MAX_LIFETIME
    connMaxLifetime: ""
    # [secret] env: OPENWA_DB_READER_DSN
    dsn: ""
    # env: OPENWA_DB_READER_MAX_IDLE_CONNS
    maxIdleConns: ""
    # env: OPENWA_DB_READER_MAX_OPEN_CONNS
